[project]
name = "matomo-site-merge"
version = "0.1.0"
description = "Merge the data of one Matomo site into another: raw logs, archived reports, goals and custom dimensions, with a journal for undo"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["PyMySQL>=1.1"]

[project.scripts]
matomo-site-merge = "matomo_site_merge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matomo_site_merge"]
